<?xml version="1.0" encoding="UTF-8"?>
<!-- Stylized Framework Laptop 13 illustration. Drawn, not a photo. -->
<svg xmlns="http://www.w3.org/2000/svg" width="116" height="84" viewBox="0 0 116 84">
  <!-- Lid / screen -->
  <g>
    <!-- bezel -->
    <rect x="18" y="6" width="80" height="52" rx="5" fill="#1c1f24"/>
    <!-- aluminium edge -->
    <rect x="18" y="6" width="80" height="52" rx="5" fill="none" stroke="#5b6068" stroke-width="1.2"/>
    <!-- screen -->
    <rect x="23" y="11" width="70" height="40" rx="2.5" fill="#0e1116"/>
    <!-- subtle screen gradient highlight -->
    <rect x="23" y="11" width="70" height="18" rx="2.5" fill="#ffffff" opacity="0.05"/>
    <!-- webcam dot -->
    <circle cx="58" cy="8.6" r="0.9" fill="#3a3f47"/>
  </g>

  <!-- Keyboard base (trapezoid, Framework silver) -->
  <g>
    <path d="M8 62 L108 62 L100 72 L16 72 Z" fill="#c7ccd2"/>
    <path d="M8 62 L108 62 L100 72 L16 72 Z" fill="none" stroke="#9aa0a8" stroke-width="1"/>
    <!-- hinge bar -->
    <rect x="18" y="58.5" width="80" height="4" rx="2" fill="#3a3f47"/>
    <!-- trackpad hint -->
    <rect x="50" y="64.5" width="16" height="5" rx="1.2" fill="#aeb4bc"/>
    <!-- front lip / Framework notch -->
    <rect x="52" y="71.5" width="12" height="2.4" rx="1.2" fill="#9aa0a8"/>
  </g>
</svg>
