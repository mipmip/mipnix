#exec-once = waybar
exec-once = mipbar
exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data

# Auto lock screen after 5 minutes of inactivity
#exec-once = swayidle -w timeout 300 'hyprlock' timeout 600 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on'

exec-once = $terminal

#exec-once = hyprshell run
#exec-once = $signal

# Delay tray-using apps to ensure mipbar's StatusNotifierWatcher is ready
exec-once = sleep 2 && $discord
exec-once = sleep 2 && $slack

exec-once = elephant
exec-once = walker --gapplication-service
exec-once = hypr-longpress

# Keep external workspaces (1-7) on whatever external monitor is connected,
# regardless of its connector name (DP-2/DP-3 vary by location). This runtime
# listener OWNS the workspace->monitor binding; nwg-displays owns monitor
# GEOMETRY (monitors.conf) and may keep writing port names into workspaces.conf
# — the listener re-applies the correct binding on every monitor add/remove.
exec-once = ~/.config/hypr/scripts/workspace-monitor-rehome

# Notification Service
exec-once = swaync

# Initialize wallpaper symlink based on current theme before starting wpaperd
exec-once = ~/.config/hypr/scripts/theme-wallpaper init
exec-once = wpaperd -d

