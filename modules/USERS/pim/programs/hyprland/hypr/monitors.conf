# Monitors are matched by their EDID description (make + model + serial),
# which is stable per physical unit — unlike connector names (DP-2/DP-3/
# HDMI-A-1) that vary by port and by machine. One file works everywhere.
#
# To add a monitor: connect it, run `hyprctl monitors all | grep description`,
# and copy the string after "description:" into a `desc:` line below.
#
# Format:  monitor = desc:<description>, <resolution>, <position>, <scale>
# `auto` position lets Hyprland arrange displays left-to-right automatically.

# --- Laptop panels ---

# peterspav laptop (native 16:9 1080p panel)
monitor = desc:Najing CEC Panda FPD Technology CO. ltd 0x0040, 1920x1080@60, auto, 1.33333

# cichorei laptop (Lenovo, AU Optronics 1080p panel).
# Positioned to the RIGHT of the external monitor: the LG UltraFine and the
# Philips are both pinned at 0x0 with a logical width of 3840 / 1.5 = 2560, so
# this panel starts at x=2560.
monitor = desc:AU Optronics 0x408D, 1920x1080@60, 2560x0, 1.5

# Framework laptop  (TODO: fill in — run `hyprctl monitors all | grep description`)
#monitor = desc:<framework panel description>, preferred, auto, 1.6

# --- External monitors ---

# LG UltraFine (home) — pinned at origin so laptop panels sit to its right.
monitor = desc:LG Electronics LG ULTRAFINE 505NTQDDM164, 3840x2160@60, 0x0, 1.5

# Philips (work) — pinned at origin so the laptop panel sits to its right.
# 3840x2160 @ scale 1.5 → logical width 2560 (same as the LG), so the laptop
# panel pinned at x=2560 lands directly to the right of it.
monitor = desc:Philips Consumer Electronics Company 27E1N1800A UK02524050499, 3840x2160@60, 0x0, 1.5

# --- Fallback: any monitor not listed above gets its preferred mode ---
monitor = , preferred, auto, auto
