# Workspace → monitor assignments.
#
# Workspaces 1–7 intentionally have NO `monitor:` pin: the external monitor's
# connector name varies by location (DP-2 at home, DP-3 at work), so a static
# connector pin here cannot be correct — a dead-connector rule strands the
# workspace on the laptop. Their placement on "the connected external monitor"
# is owned entirely at runtime by scripts/workspace-monitor-rehome.
#
# Workspaces 8/9/0 keep the eDP-1 pin: the laptop panel is always eDP-1 (stable).
#
# (Originally emitted by nwg-displays; now a repo-owned, immutable config —
# nwg-displays does not rewrite it. See openspec fix-workspace-monitor-binding.)

workspace=1,default:true
workspace=2
workspace=3
workspace=4
workspace=5
workspace=6
workspace=7
workspace=8,monitor:eDP-1,default:true
workspace=9,monitor:eDP-1
workspace=0,monitor:eDP-1
