#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

#env = XCURSOR_SIZE,24
#env = HYPRCURSOR_SIZE,24

env = HYPRCURSOR_THEME,rose-pine-hyprcursor
env = HYPRCURSOR_SIZE,28

# Use the plain openssh ssh-agent (services.ssh-agent) instead of gcr's, so the
# session (and mipbar's SshKey widget) talks to an agent that can actually sign.
# See modules/USERS/pim/programs/mipbar/default.nix for the full rationale.
env = SSH_AUTH_SOCK,$XDG_RUNTIME_DIR/ssh-agent



# Screenshots land here instead of in the pictures folder root. Set as an
# environment variable rather than as `-o` on the screenshot binds, because this
# also covers `hyprshot` typed into a terminal, and because it keeps
# shot-notify from having to know the save location: hyprshot hands it the
# finished path. hyprshot creates the directory itself on first capture.
env = HYPRSHOT_DIR,$HOME/Afbeeldingen/Schermafbeeldingen
