#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

#env = XCURSOR_SIZE,24
#env = HYPRCURSOR_SIZE,24

env = HYPRCURSOR_THEME,rose-pine-hyprcursor
env = HYPRCURSOR_SIZE,28

# Use the plain openssh ssh-agent (services.ssh-agent) instead of gcr's, so the
# session (and mipbar's SshKey widget) talks to an agent that can actually sign.
# See modules/USERS/pim/programs/mipbar/default.nix for the full rationale.
env = SSH_AUTH_SOCK,$XDG_RUNTIME_DIR/ssh-agent


