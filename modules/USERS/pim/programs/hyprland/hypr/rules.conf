##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
# windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
# windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# SSH passphrase askpass (lxqt-openssh-askpass, fired by the mipbar SshKey
# widget). It reports an empty window class, so match on its title; float and
# center it instead of letting it tile into the layout.
# NB: Hyprland 0.53+ replaced the old `windowrule = float, title:^(X)$` /
# `windowrulev2` syntax with `match:<prop>` matchers and `<action> on` values.
# The old form errors with "invalid field float: missing a value".
windowrule = match:title ^(OpenSSH Authentication Passphrase request)$, float on, center on



decoration:blur {
  brightness=0.5
  contrast=0.8
  enabled=true
  noise=0.09
  passes=4
  size=16
  vibrancy=0.8
  vibrancy_darkness=0.8
}

