# Idle and sleep policy for this session.
#
# Two things are deliberately kept apart here:
#
#   LOCKING  happens on idle, and before every sleep.      <- this file
#   SLEEPING happens only when the user asks for it.       <- logind, IdleAction=ignore
#
# The machine does not suspend itself. Turning the display off at 15 minutes is
# not sleep: the machine stays awake, reachable over the network, and any input
# brings back the lock screen.
#
# Started by `exec-once = hypridle` in autostart.conf, not by
# services.hypridle.enable, because that module's user unit is WantedBy
# graphical-session.target and this session never populates it.

general {
    # Single-instance guard. Without it a second locker can spawn on top of the
    # first, and killing one leaves a screen that looks locked but cannot be
    # authenticated against.
    lock_cmd = pidof hyprlock || hyprlock

    # Lock before ANY sleep, whatever triggered it: lid close, the suspend
    # keybind, a systemctl suspend typed by hand. hypridle holds a logind sleep
    # inhibitor while this runs, so the lock lands before the machine goes down
    # rather than after it comes back. Safe to route through DBus here
    # specifically because hypridle is the process running it, so the listener
    # is guaranteed alive at this moment.
    before_sleep_cmd = loginctl lock-session

    # Some resume paths leave DPMS off, which reads as a failed wake.
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 10 minutes: lock. The machine stays fully awake.
# No on-resume here on purpose. The screen must stay locked when the user
# returns; that is the entire point of the control.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 15 minutes: power the panel down. Still not sleep.
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
