  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"d12f1c97-9c9a-4124-afbf-ae28a31de6ec\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  html, body { margin: 0; padding: 0; }\n  * { box-sizing: border-box; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"width: max-content; min-width: 100%; min-height: 100vh; box-sizing: border-box; padding: 44px; background: #e7e5df; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\">\n\n  <div style=\"max-width: 1224px; margin: 0 0 36px;\">\n    <div style=\"font: 700 12px ui-sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #9a958c;\">Hyprland workspace bar · new feature<\u002Fdiv>\n    <h1 style=\"font-weight: 700; font-size: 30px; letter-spacing: -.02em; color: #2a2722; margin: 9px 0 7px;\">Workspace → screen binding<\u002Fh1>\n    <p style=\"font: 400 15px/1.55 ui-sans-serif; color: #6b665d; margin: 0; max-width: 760px;\">Each workspace gets a thin underline in the colour of the monitor it's bound to. Right-click a workspace to open the screen picker — each connected display is shown with a product image of the device, its model, resolution, refresh rate and connection port.<\u002Fp>\n    <div style=\"display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap;\">\n      <sc-for list=\"{{ legend }}\" as=\"mon\" hint-placeholder-count=\"3\">\n        <div style=\"display: flex; align-items: center; gap: 9px; padding: 7px 14px 7px 11px; background: #fff; border: 1px solid #e4e0d8; border-radius: 999px;\">\n          <span style=\"width: 10px; height: 10px; border-radius: 50%; background: {{ mon.accent }};\"><\u002Fspan>\n          <span style=\"font: 700 13px ui-sans-serif; color: #2a2722;\">{{ mon.name }}<\u002Fspan>\n          <span style=\"font: 500 12px ui-sans-serif; color: #a7a299;\">{{ mon.model }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; gap: 24px; align-items: flex-start;\">\n\n    <!-- LIGHT -->\n    <div style=\"flex: none; width: 600px;\">\n      <div style=\"font: 600 11px ui-sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #9a958c; margin-bottom: 8px;\">Light<\u002Fdiv>\n      <div style=\"position: relative; height: 364px; border-radius: 4px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.1); background: linear-gradient(135deg, oklch(0.9 0.05 92) 0%, oklch(0.83 0.075 150) 48%, oklch(0.82 0.07 226) 100%);\">\n        <div style=\"position: absolute; top: 24px; left: 24px;\">\n          <div style=\"display: flex; align-items: stretch; gap: 2px; padding: 5px; border-radius: 13px; background: oklch(0.99 0.004 286 / 0.46); border: 1px solid oklch(1 0 0 / 0.55); box-shadow: 0 8px 30px -8px rgba(20,20,40,.28), inset 0 1px 0 oklch(1 0 0 / .55); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); width: max-content;\">\n            <div style=\"display: grid; grid-template-columns: repeat(3,3px); gap: 3px; align-content: center; padding: 0 9px; align-self: center;\">\n              <sc-for list=\"{{ dotsLight }}\" as=\"d\" hint-placeholder-count=\"9\"><span style=\"width: 3px; height: 3px; border-radius: 1px; background: {{ d }};\"><\u002Fspan><\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-for list=\"{{ barLight }}\" as=\"ws\" hint-placeholder-count=\"10\">\n              <div style=\"display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 5px 9px; border-radius: 9px; background: {{ ws.pillBg }};\">\n                <div style=\"display: flex; align-items: center; gap: 5px; min-height: 17px;\">\n                  <sc-if value=\"{{ ws.icon }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display: flex; align-items: center;\">{{ ws.icon }}<\u002Fspan><\u002Fsc-if>\n                  <span style=\"font: 600 13px ui-sans-serif; color: {{ ws.numColor }};\">{{ ws.num }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"width: 14px; height: 2.5px; border-radius: 2px; background: {{ ws.accent }};\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position: absolute; top: 84px; left: 150px; width: 320px; z-index: 5;\">\n          <div style=\"position: absolute; top: -5px; left: 128px; width: 10px; height: 10px; background: #fff; transform: rotate(45deg); border-top: 1px solid #ece8e0; border-left: 1px solid #ece8e0;\"><\u002Fdiv>\n          <div style=\"position: relative; background: #fff; border: 1px solid #ece8e0; border-radius: 14px; box-shadow: 0 18px 44px -10px rgba(20,20,40,.38); padding: 6px;\">\n            <div style=\"padding: 8px 9px 8px;\">\n              <div style=\"font: 700 9px ui-sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #a7a299;\">Workspace 6 · bound to screen<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ menuLight }}\" as=\"row\" hint-placeholder-count=\"3\">\n              <div style=\"display: flex; align-items: center; gap: 12px; padding: 9px 12px; margin-bottom: 5px; border-radius: 11px; background: {{ row.tileBg }}; border: {{ row.border }};\">\n                <span style=\"display: flex; align-items: center; flex: none;\">{{ row.thumb }}<\u002Fspan>\n                <div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1;\">\n                  <div style=\"display: flex; align-items: center; gap: 7px;\">\n                    <span style=\"font: 700 13px ui-sans-serif; color: #2a2722;\">{{ row.model }}<\u002Fspan>\n                    <sc-if value=\"{{ row.selected }}\" hint-placeholder-val=\"{{ false }}\">\n                      <span style=\"font: 700 8.5px ui-sans-serif; letter-spacing: .06em; text-transform: uppercase; color: {{ row.accent }}; background: {{ row.chipBg }}; padding: 2px 7px; border-radius: 999px;\">Current<\u002Fspan>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                  <div style=\"font: 500 11px ui-sans-serif; color: #8a857c;\">{{ row.specLine }}<\u002Fdiv>\n                  <div style=\"display: flex; align-items: center; gap: 7px;\">\n                    <span style=\"display: flex; align-items: center; gap: 5px; padding: 3px 8px 3px 6px; border-radius: 999px; background: {{ row.chipBg }};\">\n                      <span style=\"display: flex;\">{{ row.portIcon }}<\u002Fspan>\n                      <span style=\"font: 600 10.5px ui-sans-serif; color: {{ row.accent }};\">{{ row.port }}<\u002Fspan>\n                    <\u002Fspan>\n                    <span style=\"font: 600 10.5px ui-monospace, monospace; color: #b3aea4;\">{{ row.name }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- DARK -->\n    <div style=\"flex: none; width: 600px;\">\n      <div style=\"font: 600 11px ui-sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #9a958c; margin-bottom: 8px;\">Dark<\u002Fdiv>\n      <div style=\"position: relative; height: 364px; border-radius: 4px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.1); background: linear-gradient(135deg, oklch(0.34 0.07 280) 0%, oklch(0.26 0.05 250) 55%, oklch(0.3 0.08 330) 100%);\">\n        <div style=\"position: absolute; top: 24px; left: 24px;\">\n          <div style=\"display: flex; align-items: stretch; gap: 2px; padding: 5px; border-radius: 13px; background: oklch(0.21 0.01 286 / 0.42); border: 1px solid oklch(1 0 0 / 0.09); box-shadow: 0 8px 30px -8px rgba(0,0,0,.4), inset 0 1px 0 oklch(1 0 0 / .08); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); width: max-content;\">\n            <div style=\"display: grid; grid-template-columns: repeat(3,3px); gap: 3px; align-content: center; padding: 0 9px; align-self: center;\">\n              <sc-for list=\"{{ dotsDark }}\" as=\"d\" hint-placeholder-count=\"9\"><span style=\"width: 3px; height: 3px; border-radius: 1px; background: {{ d }};\"><\u002Fspan><\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-for list=\"{{ barDark }}\" as=\"ws\" hint-placeholder-count=\"10\">\n              <div style=\"display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 5px 9px; border-radius: 9px; background: {{ ws.pillBg }};\">\n                <div style=\"display: flex; align-items: center; gap: 5px; min-height: 17px;\">\n                  <sc-if value=\"{{ ws.icon }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display: flex; align-items: center;\">{{ ws.icon }}<\u002Fspan><\u002Fsc-if>\n                  <span style=\"font: 600 13px ui-sans-serif; color: {{ ws.numColor }};\">{{ ws.num }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"width: 14px; height: 2.5px; border-radius: 2px; background: {{ ws.accent }};\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position: absolute; top: 84px; left: 150px; width: 320px; z-index: 5;\">\n          <div style=\"position: absolute; top: -5px; left: 128px; width: 10px; height: 10px; background: oklch(0.21 0.012 286); transform: rotate(45deg); border-top: 1px solid oklch(0.32 0.01 286); border-left: 1px solid oklch(0.32 0.01 286);\"><\u002Fdiv>\n          <div style=\"position: relative; background: oklch(0.21 0.012 286); border: 1px solid oklch(0.32 0.01 286); border-radius: 14px; box-shadow: 0 18px 44px -10px rgba(0,0,0,.6); padding: 6px;\">\n            <div style=\"padding: 8px 9px 8px;\">\n              <div style=\"font: 700 9px ui-sans-serif; letter-spacing: .1em; text-transform: uppercase; color: oklch(0.62 0.01 286);\">Workspace 6 · bound to screen<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ menuDark }}\" as=\"row\" hint-placeholder-count=\"3\">\n              <div style=\"display: flex; align-items: center; gap: 12px; padding: 9px 12px; margin-bottom: 5px; border-radius: 11px; background: {{ row.tileBg }}; border: {{ row.border }};\">\n                <span style=\"display: flex; align-items: center; flex: none;\">{{ row.thumb }}<\u002Fspan>\n                <div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1;\">\n                  <div style=\"display: flex; align-items: center; gap: 7px;\">\n                    <span style=\"font: 700 13px ui-sans-serif; color: oklch(0.96 0.004 286);\">{{ row.model }}<\u002Fspan>\n                    <sc-if value=\"{{ row.selected }}\" hint-placeholder-val=\"{{ false }}\">\n                      <span style=\"font: 700 8.5px ui-sans-serif; letter-spacing: .06em; text-transform: uppercase; color: {{ row.accent }}; background: {{ row.chipBg }}; padding: 2px 7px; border-radius: 999px;\">Current<\u002Fspan>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                  <div style=\"font: 500 11px ui-sans-serif; color: oklch(0.62 0.01 286);\">{{ row.specLine }}<\u002Fdiv>\n                  <div style=\"display: flex; align-items: center; gap: 7px;\">\n                    <span style=\"display: flex; align-items: center; gap: 5px; padding: 3px 8px 3px 6px; border-radius: 999px; background: {{ row.chipBg }};\">\n                      <span style=\"display: flex;\">{{ row.portIcon }}<\u002Fspan>\n                      <span style=\"font: 600 10.5px ui-sans-serif; color: {{ row.accent }};\">{{ row.port }}<\u002Fspan>\n                    <\u002Fspan>\n                    <span style=\"font: 600 10.5px ui-monospace, monospace; color: oklch(0.55 0.01 286);\">{{ row.name }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <!-- HANDOFF NOTE -->\n  <div style=\"max-width: 1224px; margin-top: 28px; background: #fff; border: 1px solid #e4e0d8; border-radius: 4px; padding: 22px 24px; display: flex; gap: 40px; flex-wrap: wrap;\">\n    <div style=\"flex: 1; min-width: 300px;\">\n      <div style=\"font: 700 11px ui-sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #9a958c; margin-bottom: 10px;\">Indicator<\u002Fdiv>\n      <p style=\"font: 400 13.5px/1.55 ui-sans-serif; color: #4a463f; margin: 0;\">Resolve each workspace's monitor from the Hyprland event socket (<span style=\"font-family: ui-monospace, monospace; font-size: 12.5px; color: #2a2722;\">workspaces<\u002Fspan> / <span style=\"font-family: ui-monospace, monospace; font-size: 12.5px; color: #2a2722;\">monitors<\u002Fspan>) and draw a 2.5px underline in that monitor's accent. Map monitor name → a stable accent (config map, falling back to a hashed hue) so colours stay consistent across reloads.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex: 1; min-width: 300px;\">\n      <div style=\"font: 700 11px ui-sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #9a958c; margin-bottom: 10px;\">Screen picker<\u002Fdiv>\n      <p style=\"font: 400 13.5px/1.55 ui-sans-serif; color: #4a463f; margin: 0;\">Specs read from <span style=\"font-family: ui-monospace, monospace; font-size: 12.5px; color: #2a2722;\">hyprctl monitors -j<\u002Fspan>: <span style=\"font-family: ui-monospace, monospace; font-size: 12.5px; color: #2a2722;\">description<\u002Fspan> (model), active mode, connector. The product image keys off device type — laptop for <span style=\"font-family: ui-monospace, monospace; font-size: 12.5px; color: #2a2722;\">eDP<\u002Fspan>, monitor otherwise — and can be swapped for a real photo matched on model string. Selecting a row runs <span style=\"font-family: ui-monospace, monospace; font-size: 12.5px; color: #2a2722;\">hyprctl dispatch moveworkspacetomonitor 6 NAME<\u002Fspan>.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() {\n    const R = window.React;\n    const E = (tag, props, ch) => R.createElement(tag, props, ch);\n    const MON = {\n      'eDP-1':    { l: 0.62, c: 0.13, h: 150, device: 'laptop',  model: 'Built-in display', size: '13.5\"', res: '2256×1504', hz: '60 Hz',  port: 'eDP · internal',  portType: 'edp' },\n      'DP-1':     { l: 0.58, c: 0.16, h: 264, device: 'monitor', model: 'Dell U2720Q',      size: '27\"',   res: '3840×2160', hz: '60 Hz',  port: 'USB-C',           portType: 'usbc' },\n      'HDMI-A-1': { l: 0.74, c: 0.15, h: 66,  device: 'monitor', model: 'Samsung S24R35',   size: '24\"',   res: '1920×1080', hz: '75 Hz',  port: 'HDMI 2.0',        portType: 'hdmi' },\n    };\n    const wsMon = { '1':'eDP-1','2':'eDP-1','3':'eDP-1','4':'DP-1','5':'DP-1','6':'DP-1','7':'DP-1','8':'HDMI-A-1','9':'HDMI-A-1','0':'HDMI-A-1' };\n    const occ = { '2':'terminal','4':'code','6':'firefox','8':'music','9':'chat' };\n    const active = '6';\n    const order = ['1','2','3','4','5','6','7','8','9','0'];\n\n    const acc = (m, dark) => `oklch(${(dark ? Math.min(m.l + 0.09, 0.84) : m.l).toFixed(3)} ${m.c} ${m.h})`;\n    const soft = (m, a) => `oklch(${m.l} ${m.c} ${m.h} / ${a})`;\n\n    const ic = (type, color) => {\n      if (!type) return null;\n      const base = { width: 13, height: 13, viewBox: '0 0 24 24', fill: 'none', stroke: color, strokeWidth: 2.1, strokeLinecap: 'round', strokeLinejoin: 'round' };\n      const P = (d, k) => E('path', { d, key: k || d });\n      const C = (p, k) => E('circle', { ...p, key: k });\n      const L = (p, k) => E('line', { ...p, key: k });\n      const svg = (ch) => E('svg', base, ch);\n      switch (type) {\n        case 'terminal': return svg([P('M4 17l6-5-6-5', 'a'), L({ x1: 12, y1: 18, x2: 20, y2: 18 }, 'b')]);\n        case 'code':     return svg([P('M16 18l5-6-5-6', 'a'), P('M8 6l-5 6 5 6', 'b')]);\n        case 'firefox':  return svg([C({ cx: 12, cy: 12, r: 9 }, 'a'), P('M12 3a6 6 0 1 0 6 6', 'b')]);\n        case 'music':    return svg([C({ cx: 6, cy: 18, r: 2.6 }, 'a'), C({ cx: 18, cy: 16, r: 2.6 }, 'b'), P('M8.6 18V6.5l10.4-2v9', 'c')]);\n        case 'chat':     return svg([P('M21 11.5a8 8 0 0 1-11.5 7.2L4 20l1.3-4.2A8 8 0 1 1 21 11.5z', 'a')]);\n      }\n      return null;\n    };\n\n    const portIcon = (type, color) => {\n      const base = { width: 14, height: 14, viewBox: '0 0 24 24', fill: 'none', stroke: color, strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' };\n      const P = (d, k) => E('path', { d, key: k || d });\n      const Rect = (p, k) => E('rect', { ...p, key: k });\n      const L = (p, k) => E('line', { ...p, key: k });\n      const svg = (ch) => E('svg', base, ch);\n      if (type === 'usbc') return svg([Rect({ x: 3, y: 9, width: 18, height: 6, rx: 3 }, 'a'), L({ x1: 7.5, y1: 12, x2: 16.5, y2: 12 }, 'b')]);\n      if (type === 'edp')  return svg([Rect({ x: 4, y: 5, width: 16, height: 11, rx: 1.5 }, 'a'), L({ x1: 2, y1: 19, x2: 22, y2: 19 }, 'b')]);\n      return svg([P('M7 9h10v3.5a4 4 0 0 1-4 4h-2a4 4 0 0 1-4-4z', 'a'), L({ x1: 9.5, y1: 9, x2: 9.5, y2: 5.5 }, 'b'), L({ x1: 14.5, y1: 9, x2: 14.5, y2: 5.5 }, 'c')]);\n    };\n\n    const deviceThumb = (m) => {\n      const bezel = '#23262c', stand = '#3a3d44';\n      const screen = `oklch(0.33 ${Math.min(m.c, 0.08).toFixed(3)} ${m.h})`;\n      const glow = acc(m, false);\n      const Rect = (p, k) => E('rect', { ...p, key: k });\n      if (m.device === 'laptop') {\n        return E('svg', { width: 58, height: 42, viewBox: '0 0 64 46', fill: 'none' }, [\n          Rect({ x: 13, y: 4, width: 38, height: 25, rx: 2, fill: bezel }, 'lid'),\n          Rect({ x: 15, y: 6, width: 34, height: 21, rx: 1, fill: screen }, 'scr'),\n          Rect({ x: 15, y: 23.5, width: 34, height: 2, fill: glow }, 'glow'),\n          E('path', { key: 'base', d: 'M7 42 L57 42 Q59 42 58.4 40.2 L53 30.8 Q52.5 30 51 30 L13 30 Q11.5 30 11 30.8 L5.6 40.2 Q5 42 7 42 Z', fill: stand }),\n          Rect({ x: 27, y: 30, width: 10, height: 2, rx: 1, fill: '#23262c' }, 'notch'),\n        ]);\n      }\n      return E('svg', { width: 58, height: 42, viewBox: '0 0 64 46', fill: 'none' }, [\n        Rect({ x: 5, y: 3, width: 54, height: 32, rx: 2.5, fill: bezel }, 'fr'),\n        Rect({ x: 7.5, y: 5.5, width: 49, height: 27, rx: 1.5, fill: screen }, 'scr'),\n        Rect({ x: 7.5, y: 30, width: 49, height: 2.5, fill: glow }, 'glow'),\n        Rect({ x: 28, y: 35, width: 8, height: 6, fill: stand }, 'neck'),\n        Rect({ x: 20, y: 40.5, width: 24, height: 3.5, rx: 1.75, fill: stand }, 'base'),\n      ]);\n    };\n\n    const pill = (num, dark) => {\n      const m = MON[wsMon[num]];\n      const isActive = num === active;\n      const isOcc = !!occ[num];\n      let pillBg, numColor, iconColor;\n      if (dark) {\n        pillBg = isActive ? 'oklch(0.58 0.02 286 / 0.78)' : (isOcc ? 'oklch(0.40 0.012 286 / 0.6)' : 'transparent');\n        numColor = (isActive || isOcc) ? 'oklch(0.97 0.004 286)' : 'oklch(0.72 0.01 286)';\n        iconColor = 'oklch(0.90 0.008 286)';\n      } else {\n        pillBg = isActive ? 'oklch(0.79 0.012 286 / 0.95)' : (isOcc ? 'oklch(0.90 0.018 286 / 0.85)' : 'transparent');\n        numColor = (isActive || isOcc) ? 'oklch(0.30 0.015 286)' : 'oklch(0.47 0.012 286)';\n        iconColor = 'oklch(0.38 0.02 286)';\n      }\n      return { num, accent: acc(m, dark), pillBg, numColor, icon: ic(occ[num], iconColor) };\n    };\n\n    const menu = (dark) => ['eDP-1','DP-1','HDMI-A-1'].map((name) => {\n      const m = MON[name];\n      const selected = name === 'DP-1';\n      const a = acc(m, dark);\n      return {\n        name,\n        model: m.model,\n        specLine: `${m.size} · ${m.res} · ${m.hz}`,\n        port: m.port,\n        accent: a,\n        thumb: deviceThumb(m),\n        portIcon: portIcon(m.portType, a),\n        selected,\n        chipBg: soft(m, dark ? 0.26 : 0.15),\n        tileBg: selected ? soft(m, dark ? 0.22 : 0.12) : (dark ? 'oklch(0.26 0.008 286)' : 'oklch(0.975 0.003 286)'),\n        border: selected ? `1.5px solid ${a}` : (dark ? '1.5px solid oklch(0.30 0.01 286)' : '1.5px solid oklch(0.93 0.004 286)'),\n      };\n    });\n\n    return {\n      barLight: order.map((n) => pill(n, false)),\n      barDark: order.map((n) => pill(n, true)),\n      menuLight: menu(false),\n      menuDark: menu(true),\n      dotsLight: Array(9).fill('oklch(0.55 0.01 286)'),\n      dotsDark: Array(9).fill('oklch(0.70 0.01 286)'),\n      legend: ['eDP-1','DP-1','HDMI-A-1'].map((name) => {\n        const m = MON[name];\n        return { name, model: m.model, accent: acc(m, false) };\n      }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
